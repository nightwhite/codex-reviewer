name: "Codex Reviewer"
description: "Review only the latest commit in a pull request with Codex."
author: "codex-reviewer"
inputs:
  github-token:
    description: "GitHub token used to read PR data and write the review comment."
    required: true
  provider-base-url:
    description: "Responses-compatible provider base URL, for example https://llm.example.com/v1."
    required: true
  provider-api-key:
    description: "API key for the configured Codex model provider."
    required: true
  model:
    description: "Codex model name to request from the configured provider."
    required: true
  codex-version:
    description: "Version of @openai/codex to install."
    required: false
    default: "latest"
  effort:
    description: "Optional Codex reasoning effort."
    required: false
    default: ""
  working-directory:
    description: "Repository directory passed to codex exec --cd."
    required: false
    default: ""
  sandbox:
    description: "Codex sandbox mode. One of read-only, workspace-write, or danger-full-access."
    required: false
    default: "read-only"
outputs:
  review:
    description: "Markdown review generated by Codex."
    value: ${{ steps.review.outputs.review }}
runs:
  using: "composite"
  steps:
    - name: Ensure Node.js available
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install Codex CLI
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: npm install -g "@openai/codex@${CODEX_VERSION}"

    - name: Run Codex reviewer
      id: review
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_PROVIDER_BASE_URL: ${{ inputs.provider-base-url }}
        INPUT_PROVIDER_API_KEY: ${{ inputs.provider-api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_EFFORT: ${{ inputs.effort }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_SANDBOX: ${{ inputs.sandbox }}
      run: node "${{ github.action_path }}/dist/main.cjs"
